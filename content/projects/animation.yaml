shortDescription: 'The opening scene of an animation: storyboarded in Procreate, an eye modelled in Blender, composited in After Effects.'
longDescription: 'The first scene of an animation, made for Digital Prototyping. The storyboard is six frames in Procreate: a clown in striped socks walks into a spotlight while a wall of mechanical eyes follows him. The eye was modelled and rendered in Blender so it could be turned and lit from any angle. The scene was assembled in After Effects with painted elements from Procreate and Photoshop.'
moduleEyebrow: Three stages
moduleTitle: Board, eye, scene.
moduleBody: Six frames set the action. The eye was built once in Blender and reused for every angle.
