shortDescription: A chap book of Dostoyevsky's Notes from Underground, typeset in InDesign with artwork made in Illustrator.
longDescription: 'A chap book for Typography + Info, setting Fyodor Dostoyevsky''s Notes from Underground. The text was set first as a plain exercise called Invisible: two spreads where the typography stays out of the way. The finished book breaks that setting open. A second voice cuts across the prose in red and black, letters run off the page, and the type becomes part of the picture.'
moduleEyebrow: Setting, then book
moduleTitle: Invisible, then loud.
moduleBody: The first two spreads set the text quietly. The finished book lets a second voice in red run across it.
