featured: true
accent: '#d758b3'
shortDescription: A specimen for Alternate Gothic that starts from a lowercase g modelled in clay.
longDescription: 'A type specimen for Alternate Gothic, made for Typography + Info. It started with one letter: I modelled the lowercase g in clay, photographed it, and drew from it in Illustrator. Those drawings became a set of black and white pattern studies, then a run of black and white magazine pages, and finally the specimen itself: a teen-magazine issue set entirely in Alternate Gothic, in pink, green and magenta.'
moduleEyebrow: One letter first
moduleTitle: The g, in clay and in ink.
moduleBody: The clay g was photographed and drawn before any page was set. The finished pages are the only part of the project in colour.
