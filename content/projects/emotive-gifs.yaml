shortDescription: Eight looping GIFs of one character, one for each emotion, made in Photoshop.
longDescription: 'Eight GIFs for Dynamic Imagery: anger, confusion, excitement, sadness, fear, disgust, joy and surprise. One character carries all eight. Every loop keeps the same framing, so the emotion has to come from the eyes, the brows and the posture. The stills here are single frames from each loop; the finished pieces move.'
moduleEyebrow: Eight emotions
moduleTitle: One character, eight readings.
moduleBody: Same framing every time. Anger folds its arms; the rest is done with the eyes and the brows.
