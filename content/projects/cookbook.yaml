shortDescription: A Mediterranean cookbook set in InDesign and illustrated with one red octopus that reaches through every page.
longDescription: 'A cookbook for Process & Production. Lenny''s Cookbook collects Mediterranean recipes, set in InDesign and illustrated in Illustrator. One octopus is the only illustration: reversed out in white, it wraps the cover; inside, in red, it holds the bowls and reaches across the recipe pages. Each recipe carries hand-drawn icons for cooking time and serving size. The book was printed and photographed.'
