shortDescription: A printed deck of playing cards with a different monster drawn on every face.
longDescription: A deck of playing cards for Process & Production, drawn in Illustrator. Each card carries its own creature in black line over cream, red or purple, with the rank and suit in the corners. The back is a field of eyes. The deck was printed and boxed; the photographs show the finished cards.
moduleEyebrow: Deck
moduleTitle: A monster on every face.
moduleBody: 'Black line on three colours: cream, red and purple. The back is nothing but eyes.'
