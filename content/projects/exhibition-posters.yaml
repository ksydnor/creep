shortDescription: Three posters for an exhibition on dreams and nightmares, built from four paintings made as research.
longDescription: 'Three posters for Research, Analysis & Process. The research came first, as four paintings in Procreate: two nightmares, a scratched black and white room with something at the window and a girl asleep on a bed with impossibly tall legs, and two dreams, an open mouth full of teeth in pink and green and a pair of clasped hands. The posters were composed in Photoshop from those paintings and from photographed hands. Each one is vertical, gives the image most of the sheet, and carries one line of rough, distressed type: Are you dreaming right now? The absurd awaits your sleep. When dreams turn on us.'
moduleEyebrow: Research first
moduleTitle: Paint it, then set it.
moduleBody: The nightmare and the dream were painted before a single poster was laid out.
