shortDescription: Three banknotes for the Central Republic of Mothville, each carrying a different moth.
longDescription: 'A currency for Process & Production, drawn in Illustrator. Three notes for the Central Republic of Mothville: a 10, a 50 and a 100 in blue, pink and green. Each front carries a different moth over a fine-line ground with a star, a seal and a serial number; each back repeats the moth in reverse with a signature. The notes were printed and photographed.'
