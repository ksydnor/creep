# Runs the prebuilt image on the droplet. The droplet only pulls; it never builds.
#
#   Build + push from your machine:
#     docker build --target runner --platform linux/amd64 -t "$IMAGE" .
#     docker push "$IMAGE"
#   Then on the droplet:
#     docker compose pull && docker compose up -d
name: pari-portfolio

services:
  app:
    image: ${IMAGE:?set IMAGE in .env}
    restart: unless-stopped
    env_file: .env
    # Loopback by default: this stack terminates no TLS, so the port must not be
    # world-reachable. Only set PORT_BIND=0.0.0.0:3000 once something in front of
    # it is doing HTTPS, or while the droplet firewall is closed to that port.
    ports:
      - "${PORT_BIND:-127.0.0.1:3000}:3000"
    volumes:
      # content.db and media/ both live here. This volume IS the site's content.
      - portfolio-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # First deploy only:  docker compose --profile seed run --rm seed
  # Needs the builder-stage image: it is the only one carrying the Payload CLI,
  # scripts/ and data/. Build and push it as a separate tag:
  #   docker build --target builder --platform linux/amd64 -t "$IMAGE_SEED" .
  seed:
    profiles: ["seed"]
    image: ${IMAGE_SEED:?set IMAGE_SEED in .env}
    env_file: .env
    # Same uid as the app image, which owns /data; seeding as root would leave
    # content.db and the uploads unwritable by the app.
    user: "1001:1001"
    environment:
      # Production puts the seed on the same migration path as the app.
      NODE_ENV: production
      # Must match the app's paths or the seed writes into the wrong place.
      DATABASE_URI: file:/data/content.db
      MEDIA_DIR: /data/media
    volumes:
      - portfolio-data:/data
    command: ["npm", "run", "seed"]

volumes:
  portfolio-data:
